# If enabled, the wireless transceiver will consume energy for transmission.
isEnergy: false

# Allow cross-dimensional connection
crossDimensional: true

# Enable auto-connect when placing blocks while sneaking.
shiftAutoConnect: true

# Enable switching Wireless Connector channels with sneak + mouse wheel.
shiftScrollChannelSwitch: false

baseEnergy: 100.0

# Maximum transmission distance between Sub and Main wireless transceivers(0 for unlimited).
maxDistance: 0.0

# Sub energy consumption = Distance between Main and Sub × Energy multiplier.
batteryMultiplier: 1.0

